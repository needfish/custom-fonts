[buildPlans.KitanMonoTerm]
family = "Kitan Mono T"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.KitanMonoTerm.variants.design]
zero = "oval-dotted"
capital-j = "serifless"
a = "double-storey-serifless"
g = "double-storey"
y = "straight-turn-serifless"

[buildPlans.KitanMonoTerm.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.KitanMonoTerm.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.KitanMonoTerm.widths.Normal]
shape = 576
menu = 5
css = "normal"

[buildPlans.KitanMonoTerm.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.KitanMonoTerm.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
